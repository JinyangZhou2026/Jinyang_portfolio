<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jinyang Zhou — Website share preview</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body { color: #f8fafc; background: #080d17; font-family: Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
      main { display: flex; flex-direction: column; justify-content: space-between; width: 1200px; height: 630px; padding: 64px 80px; }
      .brand { display: flex; align-items: center; gap: 20px; }
      .mark { display: grid; place-items: center; width: 64px; height: 64px; border: 1px solid #8290a0; border-radius: 50%; font-size: 23px; font-weight: 600; letter-spacing: -1px; }
      .label { color: #aab7c7; font-size: 17px; letter-spacing: 3px; }
      h1 { margin: 0 0 18px; font-size: 84px; line-height: 1.05; letter-spacing: -3.5px; font-weight: 600; }
      .role { margin: 0; color: #cbd5e1; font-size: 32px; line-height: 1.4; letter-spacing: -.6px; }
      footer { padding-top: 24px; border-top: 1px solid #29313d; color: #aab7c7; font-size: 22px; letter-spacing: .1px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="mark">JZ</span><span class="label">PORTFOLIO</span></div>
      <div><h1>Jinyang Zhou</h1><p class="role">Product &amp; Industrial Designer</p></div>
      <footer>zhoujinyang.com</footer>
    </main>
  </body>
</html>
